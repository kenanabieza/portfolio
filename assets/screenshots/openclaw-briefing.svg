<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="500" fill="#1A1D23"/>

  <rect x="0" y="0" width="800" height="56" fill="#21252B"/>
  <rect x="0" y="55" width="800" height="1" fill="#2D3139"/>
  <rect x="20" y="16" width="30" height="24" rx="6" fill="#f97316"/>
  <text x="35" y="32" fill="#3b1503" font-size="10" font-weight="700" text-anchor="middle">OC</text>
  <text x="62" y="33" fill="#E6E8EB" font-size="15" font-weight="700">OpenClaw &#183; Morning Briefing</text>
  <text x="288" y="33" fill="#94A3B8" font-size="12">inbox triage on a heartbeat</text>
  <rect x="656" y="18" width="120" height="22" rx="11" fill="rgba(249,115,22,0.15)"/>
  <circle cx="672" cy="29" r="4" fill="#fdba74"/>
  <text x="682" y="33" fill="#fdba74" font-size="12" font-weight="600">heartbeat 30m</text>

  <g>
    <rect x="24" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="40" y="99" fill="#E6E8EB" font-size="18" font-weight="700">07:00</text>
    <text x="40" y="116" fill="#94A3B8" font-size="11">Ready before you are</text>

    <rect x="216" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="232" y="99" fill="#E6E8EB" font-size="18" font-weight="700">96</text>
    <text x="232" y="116" fill="#94A3B8" font-size="11">Messages scanned</text>

    <rect x="408" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="424" y="99" fill="#E6E8EB" font-size="18" font-weight="700">5</text>
    <text x="424" y="116" fill="#94A3B8" font-size="11">Actually need you</text>

    <rect x="600" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="616" y="99" fill="#E6E8EB" font-size="18" font-weight="700">markdown</text>
    <text x="616" y="116" fill="#94A3B8" font-size="11">Memory on your disk</text>
  </g>

  <rect x="24" y="140" width="452" height="336" rx="12" fill="#21252B" stroke="#2D3139"/>
  <text x="44" y="167" fill="#E6E8EB" font-size="13" font-weight="700">Triage</text>
  <text x="104" y="167" fill="#94A3B8" font-size="11">labelled, sorted, drafts prepared</text>
  <line x1="24" y1="182" x2="476" y2="182" stroke="#2D3139"/>

  <rect x="44" y="198" width="412" height="46" rx="6" fill="#1A1D23"/>
  <rect x="44" y="198" width="4" height="46" rx="2" fill="#f87171"/>
  <rect x="62" y="209" width="60" height="18" rx="9" fill="rgba(248,113,113,0.15)"/>
  <text x="92" y="222" fill="#f87171" font-size="9" font-weight="700" text-anchor="middle">urgent</text>
  <text x="134" y="222" fill="#E6E8EB" font-size="11">Client escalation, contract term</text>
  <text x="134" y="238" fill="#64748B" font-size="10">reply drafted, waiting on you</text>

  <rect x="44" y="252" width="412" height="46" rx="6" fill="#1A1D23"/>
  <rect x="44" y="252" width="4" height="46" rx="2" fill="#fbbf24"/>
  <rect x="62" y="263" width="60" height="18" rx="9" fill="rgba(251,191,36,0.15)"/>
  <text x="92" y="276" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">today</text>
  <text x="134" y="276" fill="#E6E8EB" font-size="11">Invoice query from finance</text>
  <text x="134" y="292" fill="#64748B" font-size="10">context pulled from last thread</text>

  <rect x="44" y="306" width="412" height="46" rx="6" fill="#1A1D23"/>
  <rect x="44" y="306" width="4" height="46" rx="2" fill="#34d399"/>
  <rect x="62" y="317" width="60" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
  <text x="92" y="330" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">handled</text>
  <text x="134" y="330" fill="#E6E8EB" font-size="11">14 newsletters filed</text>
  <text x="134" y="346" fill="#64748B" font-size="10">labelled, archived, not shown to you</text>

  <rect x="44" y="360" width="412" height="46" rx="6" fill="#1A1D23"/>
  <rect x="44" y="360" width="4" height="46" rx="2" fill="#64748B"/>
  <rect x="62" y="371" width="60" height="18" rx="9" fill="rgba(100,116,139,0.2)"/>
  <text x="92" y="384" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="middle">quiet</text>
  <text x="134" y="384" fill="#94A3B8" font-size="11">62 low priority threads</text>
  <text x="134" y="400" fill="#64748B" font-size="10">summarised in one line each</text>

  <rect x="44" y="418" width="412" height="38" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <text x="60" y="442" fill="#64748B" font-size="10">It learns which senders you never reply to, and stops surfacing them.</text>

  <rect x="492" y="140" width="284" height="336" rx="12" fill="#21252B" stroke="#2D3139"/>
  <text x="512" y="167" fill="#E6E8EB" font-size="13" font-weight="700">Delivered to chat</text>
  <line x1="492" y1="182" x2="776" y2="182" stroke="#2D3139"/>

  <rect x="512" y="198" width="244" height="150" rx="10" fill="#1A1D23" stroke="#2D3139"/>
  <rect x="528" y="214" width="26" height="26" rx="7" fill="#f97316"/>
  <text x="541" y="232" fill="#3b1503" font-size="10" font-weight="700" text-anchor="middle">OC</text>
  <text x="564" y="226" fill="#E6E8EB" font-size="11" font-weight="700">Briefing</text>
  <text x="624" y="226" fill="#64748B" font-size="9">07:00</text>
  <text x="528" y="262" fill="#E6E8EB" font-size="11">5 need you. 1 is urgent.</text>
  <text x="528" y="284" fill="#94A3B8" font-size="11">Drafts are ready for 3.</text>
  <text x="528" y="306" fill="#94A3B8" font-size="11">Rest is filed.</text>
  <rect x="528" y="318" width="120" height="20" rx="10" fill="rgba(249,115,22,0.15)"/>
  <text x="588" y="332" fill="#fdba74" font-size="10" font-weight="600" text-anchor="middle">reply to approve</text>

  <text x="512" y="378" fill="#94A3B8" font-size="11" font-weight="700">CHANNEL</text>
  <rect x="512" y="388" width="76" height="24" rx="12" fill="#1A1D23" stroke="#2D3139"/>
  <text x="550" y="404" fill="#94A3B8" font-size="10" text-anchor="middle">Telegram</text>
  <rect x="596" y="388" width="60" height="24" rx="12" fill="#1A1D23" stroke="#2D3139"/>
  <text x="626" y="404" fill="#94A3B8" font-size="10" text-anchor="middle">Slack</text>
  <rect x="664" y="388" width="92" height="24" rx="12" fill="#1A1D23" stroke="#2D3139"/>
  <text x="710" y="404" fill="#94A3B8" font-size="10" text-anchor="middle">WhatsApp</text>

  <rect x="512" y="424" width="244" height="36" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <text x="634" y="446" fill="#64748B" font-size="10" text-anchor="middle">gateway bound to localhost only</text>
</svg>
