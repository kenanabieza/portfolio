<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="500" fill="#1A1D23"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#21252B"/>
  <rect x="0" y="55" width="800" height="1" fill="#2D3139"/>
  <rect x="20" y="16" width="30" height="24" rx="6" fill="#6366f1"/>
  <text x="35" y="32" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">BOT</text>
  <text x="62" y="33" fill="#E6E8EB" font-size="15" font-weight="700">Content Agent</text>
  <text x="182" y="33" fill="#94A3B8" font-size="12">Socket Mode &#183; systemd &#183; 4 GB VPS</text>
  <rect x="676" y="18" width="100" height="22" rx="11" fill="rgba(16,185,129,0.15)"/>
  <circle cx="692" cy="29" r="4" fill="#34d399"/>
  <text x="702" y="33" fill="#34d399" font-size="12" font-weight="600">active</text>

  <!-- Stat strip -->
  <g>
    <rect x="24" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="40" y="99" fill="#E6E8EB" font-size="18" font-weight="700">3</text>
    <text x="40" y="116" fill="#94A3B8" font-size="11">Channels routed</text>

    <rect x="216" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="232" y="99" fill="#E6E8EB" font-size="18" font-weight="700">1</text>
    <text x="232" y="116" fill="#94A3B8" font-size="11">Render at a time</text>

    <rect x="408" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="424" y="99" fill="#E6E8EB" font-size="18" font-weight="700">~60s</text>
    <text x="424" y="116" fill="#94A3B8" font-size="11">Paste to draft</text>

    <rect x="600" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="616" y="99" fill="#E6E8EB" font-size="18" font-weight="700">Draft</text>
    <text x="616" y="116" fill="#94A3B8" font-size="11">Never auto-publishes</text>
  </g>

  <!-- Left: chat trigger -->
  <rect x="24" y="140" width="462" height="336" rx="12" fill="#21252B" stroke="#2D3139"/>
  <text x="44" y="167" fill="#E6E8EB" font-size="13" font-weight="700">#content</text>
  <text x="112" y="167" fill="#94A3B8" font-size="11">paste in, draft out</text>
  <line x1="24" y1="182" x2="486" y2="182" stroke="#2D3139"/>

  <!-- operator message -->
  <rect x="44" y="200" width="26" height="26" rx="6" fill="#3b82f6"/>
  <text x="57" y="218" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">OP</text>
  <text x="80" y="212" fill="#E6E8EB" font-size="12" font-weight="700">Operator</text>
  <text x="146" y="212" fill="#94A3B8" font-size="10">10:02</text>
  <rect x="80" y="220" width="330" height="9" rx="4" fill="#2D3139"/>
  <rect x="80" y="234" width="386" height="9" rx="4" fill="#2D3139"/>
  <rect x="80" y="248" width="252" height="9" rx="4" fill="#2D3139"/>
  <text x="80" y="276" fill="#64748B" font-size="10">transcript pasted &#183; 1,240 characters</text>

  <!-- reactions -->
  <rect x="80" y="288" width="52" height="20" rx="10" fill="rgba(99,102,241,0.15)" stroke="#4c4fb0"/>
  <text x="106" y="302" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">ack</text>
  <rect x="140" y="288" width="60" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="#1f7a5a"/>
  <text x="170" y="302" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">done</text>

  <!-- bot reply -->
  <rect x="44" y="330" width="26" height="26" rx="6" fill="#6366f1"/>
  <text x="57" y="348" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">CA</text>
  <text x="80" y="342" fill="#E6E8EB" font-size="12" font-weight="700">Content Agent</text>
  <rect x="182" y="332" width="28" height="14" rx="4" fill="#2D3139"/>
  <text x="196" y="343" fill="#94A3B8" font-size="8" font-weight="700" text-anchor="middle">APP</text>
  <text x="80" y="362" fill="#94A3B8" font-size="11">Draft created and verified &#183; 8 slides</text>
  <text x="80" y="380" fill="#94A3B8" font-size="11">Review and schedule it in the planner.</text>

  <rect x="44" y="400" width="422" height="56" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <text x="60" y="422" fill="#94A3B8" font-size="11">Trigger filter: own channel &#183; top level &#183; not a bot</text>
  <text x="60" y="440" fill="#94A3B8" font-size="11">Serial queue so two renders never overlap</text>

  <!-- Right: pipeline -->
  <rect x="502" y="140" width="274" height="336" rx="12" fill="#21252B" stroke="#2D3139"/>
  <text x="522" y="167" fill="#E6E8EB" font-size="13" font-weight="700">Job pipeline</text>
  <line x1="502" y1="182" x2="776" y2="182" stroke="#2D3139"/>

  <line x1="535" y1="208" x2="535" y2="424" stroke="#2D3139" stroke-width="2"/>

  <circle cx="535" cy="208" r="7" fill="#34d399"/>
  <text x="556" y="206" fill="#E6E8EB" font-size="12" font-weight="600">Parse and validate</text>
  <text x="556" y="221" fill="#64748B" font-size="10">reject bad input before acking</text>

  <circle cx="535" cy="262" r="7" fill="#34d399"/>
  <text x="556" y="260" fill="#E6E8EB" font-size="12" font-weight="600">Generate copy</text>
  <text x="556" y="275" fill="#64748B" font-size="10">brand guide read at runtime</text>

  <circle cx="535" cy="316" r="7" fill="#34d399"/>
  <text x="556" y="314" fill="#E6E8EB" font-size="12" font-weight="600">Render slides</text>
  <text x="556" y="329" fill="#64748B" font-size="10">headless Chrome &#183; local fonts</text>

  <circle cx="535" cy="370" r="7" fill="#34d399"/>
  <text x="556" y="368" fill="#E6E8EB" font-size="12" font-weight="600">Upload and draft</text>
  <text x="556" y="383" fill="#64748B" font-size="10">retry with backoff</text>

  <circle cx="535" cy="424" r="7" fill="#fbbf24"/>
  <text x="556" y="422" fill="#E6E8EB" font-size="12" font-weight="600">Read back verify</text>
  <text x="556" y="437" fill="#64748B" font-size="10">never trust the 201 alone</text>
</svg>
