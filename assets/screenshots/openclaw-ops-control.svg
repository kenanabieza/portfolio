<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="500" fill="#1A1D23"/>

  <rect x="0" y="0" width="800" height="56" fill="#21252B"/>
  <rect x="0" y="55" width="800" height="1" fill="#2D3139"/>
  <rect x="20" y="16" width="30" height="24" rx="6" fill="#f97316"/>
  <text x="35" y="32" fill="#3b1503" font-size="10" font-weight="700" text-anchor="middle">OC</text>
  <text x="62" y="33" fill="#E6E8EB" font-size="15" font-weight="700">OpenClaw &#183; Ops Control</text>
  <text x="256" y="33" fill="#94A3B8" font-size="12">run the business from a chat thread</text>
  <rect x="646" y="18" width="130" height="22" rx="11" fill="rgba(16,185,129,0.15)"/>
  <circle cx="662" cy="29" r="4" fill="#34d399"/>
  <text x="672" y="33" fill="#34d399" font-size="12" font-weight="600">approval: ask</text>

  <g>
    <rect x="24" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="40" y="99" fill="#E6E8EB" font-size="18" font-weight="700">50+</text>
    <text x="40" y="116" fill="#94A3B8" font-size="11">Channels supported</text>

    <rect x="216" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="232" y="99" fill="#E6E8EB" font-size="18" font-weight="700">MCP</text>
    <text x="232" y="116" fill="#94A3B8" font-size="11">Tools, not glue code</text>

    <rect x="408" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="424" y="99" fill="#E6E8EB" font-size="18" font-weight="700">container</text>
    <text x="424" y="116" fill="#94A3B8" font-size="11">Isolated execution</text>

    <rect x="600" y="76" width="176" height="50" rx="10" fill="#21252B" stroke="#2D3139"/>
    <text x="616" y="99" fill="#E6E8EB" font-size="18" font-weight="700">vetted</text>
    <text x="616" y="116" fill="#94A3B8" font-size="11">Skills before install</text>
  </g>

  <rect x="24" y="140" width="452" height="336" rx="12" fill="#21252B" stroke="#2D3139"/>
  <text x="44" y="167" fill="#E6E8EB" font-size="13" font-weight="700">From your phone</text>
  <line x1="24" y1="182" x2="476" y2="182" stroke="#2D3139"/>

  <rect x="44" y="198" width="26" height="26" rx="7" fill="#3b82f6"/>
  <text x="57" y="216" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">OP</text>
  <text x="80" y="210" fill="#E6E8EB" font-size="12" font-weight="700">You</text>
  <text x="122" y="210" fill="#64748B" font-size="10">14:22</text>
  <rect x="80" y="220" width="300" height="30" rx="8" fill="#1A1D23"/>
  <text x="94" y="240" fill="#E6E8EB" font-size="11">pull last week's numbers and post them</text>

  <rect x="44" y="266" width="26" height="26" rx="7" fill="#f97316"/>
  <text x="57" y="284" fill="#3b1503" font-size="10" font-weight="700" text-anchor="middle">OC</text>
  <text x="80" y="278" fill="#E6E8EB" font-size="12" font-weight="700">OpenClaw</text>
  <rect x="160" y="268" width="28" height="14" rx="4" fill="#2D3139"/>
  <text x="174" y="279" fill="#94A3B8" font-size="8" font-weight="700" text-anchor="middle">APP</text>

  <rect x="80" y="288" width="376" height="88" rx="8" fill="#1A1D23" stroke="#f97316"/>
  <text x="96" y="310" fill="#fdba74" font-size="11" font-weight="700">APPROVAL REQUIRED</text>
  <text x="96" y="332" fill="#E6E8EB" font-size="11">Run a read query against the reporting database</text>
  <text x="96" y="350" fill="#64748B" font-size="10">scope: read only &#183; container: isolated &#183; timeout: 30s</text>
  <rect x="96" y="356" width="70" height="12" rx="6" fill="rgba(16,185,129,0.15)"/>
  <text x="131" y="365" fill="#34d399" font-size="8" font-weight="700" text-anchor="middle">approve</text>
  <rect x="174" y="356" width="60" height="12" rx="6" fill="rgba(248,113,113,0.12)"/>
  <text x="204" y="365" fill="#f87171" font-size="8" font-weight="700" text-anchor="middle">deny</text>

  <rect x="80" y="390" width="376" height="66" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <text x="96" y="412" fill="#E6E8EB" font-size="11" font-weight="600">Nothing runs unless you say yes</text>
  <text x="96" y="430" fill="#64748B" font-size="10">the agent runs as your user, so approval mode stays on</text>
  <text x="96" y="446" fill="#64748B" font-size="10">write actions are never set to auto</text>

  <rect x="492" y="140" width="284" height="336" rx="12" fill="#21252B" stroke="#2D3139"/>
  <text x="512" y="167" fill="#E6E8EB" font-size="13" font-weight="700">Security posture</text>
  <line x1="492" y1="182" x2="776" y2="182" stroke="#2D3139"/>

  <rect x="512" y="198" width="244" height="42" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <circle cx="532" cy="219" r="6" fill="#34d399"/>
  <text x="550" y="216" fill="#E6E8EB" font-size="11" font-weight="600">Gateway on localhost</text>
  <text x="550" y="231" fill="#64748B" font-size="10">never exposed to the internet</text>

  <rect x="512" y="250" width="244" height="42" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <circle cx="532" cy="271" r="6" fill="#34d399"/>
  <text x="550" y="268" fill="#E6E8EB" font-size="11" font-weight="600">Runs in a container</text>
  <text x="550" y="283" fill="#64748B" font-size="10">blast radius stays bounded</text>

  <rect x="512" y="302" width="244" height="42" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <circle cx="532" cy="323" r="6" fill="#34d399"/>
  <text x="550" y="320" fill="#E6E8EB" font-size="11" font-weight="600">Skills reviewed by hand</text>
  <text x="550" y="335" fill="#64748B" font-size="10">the marketplace is not trusted</text>

  <rect x="512" y="354" width="244" height="42" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <circle cx="532" cy="375" r="6" fill="#34d399"/>
  <text x="550" y="372" fill="#E6E8EB" font-size="11" font-weight="600">Patched on a schedule</text>
  <text x="550" y="387" fill="#64748B" font-size="10">advisories tracked, not ignored</text>

  <rect x="512" y="410" width="244" height="50" rx="8" fill="#1A1D23" stroke="#2D3139"/>
  <text x="528" y="430" fill="#fdba74" font-size="11" font-weight="600">This is the whole job</text>
  <text x="528" y="447" fill="#64748B" font-size="10">powerful by default, safe only by design</text>
</svg>
